[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cifar100-cnn"
version = "0.1.0"
requires-python = ">=3.12"

authors = [
    { name = "Alok Senapati" }
]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pandas-stubs~=3.0.5",
    "scikit-learn>=1.6",
    "pydantic-settings>=2.10",
    "matplotlib>=3.11.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "torchmetrics>=1.9.0",
    "tensorboard>=2.17.0",
    "streamlit>=1.38.0",
    "pillow>=10.0.0",
    "scipy-stubs~=1.18.1",
    "streamlit-drawable-canvas>=0.9.3",
    "optuna>=4.0.0",
    "optuna-dashboard>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "mypy>=1.17",
    "pre-commit>=4.2"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
